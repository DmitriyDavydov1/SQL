[tool.poetry]
name = "sql"
version = "0.1.0"
description = ""
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
requests = "^2.32.5"
python-dotenv = "^1.2.1"
pandas = "^2.3.3"
openpyxl = "^3.1.5"
psycopg2-binary = "^2.9.11"
flake8 = "^7.3.0"


[tool.poetry.group.dev.dependencies]
flake8 = "^7.3.0"
pytest = "^9.0.1"
pytest-cov = "^7.0.0"


[tool.poetry.group.lint.dependencies]
mypy = "^1.18.2"
black = "^25.11.0"
isort = "^7.0.0"

[tool.isort]
# максимальная длина строки
line_length = 119

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.flake8]
# максимальная длина строки
max-line-length = 119
# игнорировать определенные ошибки
ignore = [
    "E203",  # пробел перед ':' (может конфликтовать с black)
    "W503",  # разрыв строки перед бинарным оператором
]
# исключить папки
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "*.pyc",
    ".venv",
    "venv",
    ".pytest_cache",
    "htmlcov"
]
